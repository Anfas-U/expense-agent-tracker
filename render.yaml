services:
  - type: web
    name: pocket-money
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.interfaces.web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
