<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14213D">
  <title>Sign in | Pocket Money</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #111827;
      background: #F7F5EF;
    }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
    .card { width: min(100%, 390px); border: 1px solid #E4E7EC; border-radius: 18px; background: #fff; padding: 30px; box-shadow: 0 12px 36px rgb(20 33 61 / 8%); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 27px; }
    .mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: linear-gradient(145deg, #45B8A7, #2A9D8F); color: #14213D; font-size: 19px; font-weight: 750; }
    .brand-name { font-size: 16px; font-weight: 750; }
    .caption { margin-top: 3px; color: #667085; font-size: 12px; }
    h1 { margin: 0; font-size: 23px; letter-spacing: -.04em; }
    .intro { margin: 8px 0 23px; color: #667085; font-size: 13px; line-height: 1.5; }
    label { display: block; margin: 15px 0 7px; color: #344054; font-size: 12px; font-weight: 650; }
    input { width: 100%; min-height: 43px; border: 1px solid #E4E7EC; border-radius: 9px; padding: 0 12px; color: #111827; font: inherit; }
    input:focus { outline: 3px solid #2A9D8F33; border-color: #2A9D8F; }
    button { width: 100%; min-height: 44px; margin-top: 21px; border: 0; border-radius: 9px; background: #176F65; color: #fff; cursor: pointer; font: inherit; font-weight: 700; }
    button:hover { background: #125B54; }
    button:disabled { cursor: wait; opacity: .7; }
    .error { min-height: 20px; margin: 12px 0 0; color: #b33e3e; font-size: 13px; }
    .switch { display: block; margin-top: 16px; color: #667085; font-size: 12px; text-align: center; }
    .switch a { color: #176F65; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="mark" aria-hidden="true">₹</div>
      <div><div class="brand-name">Pocket Money</div><div class="caption">Spend with intention</div></div>
    </div>
    <h1 id="heading">Welcome back</h1>
    <p class="intro" id="intro">Sign in to view and manage your expenses.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Sign in</button>
      <p class="error" id="error" role="alert" aria-live="assertive"></p>
    </form>
    <p class="switch" id="switch">New to Pocket Money? <a href="/signup">Create an account</a></p>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const error = document.getElementById("error");
    const button = document.getElementById("submit");
    const signupMode = window.location.pathname === "/signup";
    const password = form.elements.password;
    if (signupMode) {
      document.getElementById("heading").textContent = "Create your account";
      document.getElementById("intro").textContent = "Your expenses are private to your account.";
      document.getElementById("submit").textContent = "Create account";
      document.getElementById("switch").innerHTML =
        'Already have an account? <a href="/login">Sign in</a>';
      password.autocomplete = "new-password";
      password.minLength = 12;
      password.title = "Use at least 12 characters.";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      error.textContent = "";
      button.disabled = true;
      try {
        const response = await fetch(signupMode ? "/signup" : "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.elements.username.value,
            password: form.elements.password.value
          })
        });
        const result = await response.json();
        if (!response.ok) {
          error.textContent = result.detail || "Sign-in failed. Please try again.";
          return;
        }
        window.location.assign("/");
      } catch {
        error.textContent = "Could not connect. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
